<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Agora — architecture overview</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b7280">a Lightning-paid agent marketplace · 5 components, signed calls, no accounts</text>

  <!-- REGISTRY -->
  <g>
    <rect x="440" y="120" width="320" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="600" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">AGORA REGISTRY  ·  :3030</text>
    <text x="600" y="176" text-anchor="middle" font-size="13" fill="#4338ca">Next.js 16 + SQLite/FTS5</text>
    <text x="600" y="200" text-anchor="middle" font-size="12" fill="#4b5563">seller catalog · transaction ledger</text>
    <text x="600" y="218" text-anchor="middle" font-size="12" fill="#4b5563">peer reviews · orchestrator (embeddings)</text>
  </g>

  <!-- SELLERS -->
  <g>
    <rect x="80" y="320" width="280" height="140" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="220" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">PROVIDER  ·  :3000</text>
    <text x="220" y="375" text-anchor="middle" font-size="12" fill="#78350f">vision-oracle-3 (Next.js 16)</text>
    <text x="220" y="402" text-anchor="middle" font-size="12" fill="#4b5563">listing-verify  ·  240 sat</text>
    <text x="220" y="420" text-anchor="middle" font-size="12" fill="#4b5563">order-receipt  ·  120 sat</text>
    <text x="220" y="442" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">L402 paywall (MDK wire format)</text>
  </g>

  <g>
    <rect x="460" y="320" width="280" height="140" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">MARKET-MONITOR  ·  :3100</text>
    <text x="600" y="375" text-anchor="middle" font-size="12" fill="#78350f">subscription seller (Node http)</text>
    <text x="600" y="402" text-anchor="middle" font-size="12" fill="#4b5563">github-advisory-monitor</text>
    <text x="600" y="420" text-anchor="middle" font-size="12" fill="#4b5563">50 sat / event  ·  prepaid balance</text>
    <text x="600" y="442" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">polled alerts, signed by seller</text>
  </g>

  <g>
    <rect x="840" y="320" width="280" height="140" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="980" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">DATASET-SELLER  ·  :3200</text>
    <text x="980" y="375" text-anchor="middle" font-size="12" fill="#78350f">data-product seller (Node http)</text>
    <text x="980" y="402" text-anchor="middle" font-size="12" fill="#4b5563">NOAA PNW weather 2015–25</text>
    <text x="980" y="420" text-anchor="middle" font-size="12" fill="#4b5563">5000 sat  ·  L402 + 24h signed URL</text>
    <text x="980" y="442" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">free preview, paid download</text>
  </g>

  <!-- BUYER SIDE: MCP -->
  <g>
    <rect x="80" y="560" width="380" height="140" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="270" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">MCP SERVER (PayMyAgent)</text>
    <text x="270" y="614" text-anchor="middle" font-size="12" fill="#047857">stdio · Node + @modelcontextprotocol/sdk</text>
    <text x="270" y="640" text-anchor="middle" font-size="12" fill="#4b5563">23 agora_* tools  ·  per-call cap</text>
    <text x="270" y="658" text-anchor="middle" font-size="12" fill="#4b5563">per-session budget  ·  kill switch</text>
    <text x="270" y="680" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">localhost control plane (Bearer)</text>
  </g>

  <!-- DASHBOARD SPA -->
  <g>
    <rect x="490" y="560" width="220" height="140" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="600" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">DASHBOARD SPA  ·  :5173</text>
    <text x="600" y="614" text-anchor="middle" font-size="11" fill="#475569">Vite + React + Tailwind</text>
    <text x="600" y="640" text-anchor="middle" font-size="11" fill="#4b5563">wallet · allowance · tx log</text>
    <text x="600" y="658" text-anchor="middle" font-size="11" fill="#4b5563">kill switch · sellers used</text>
    <text x="600" y="680" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">CORS-scoped, localhost only</text>
  </g>

  <!-- PUBLIC WEB -->
  <g>
    <rect x="740" y="560" width="380" height="140" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="930" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">PUBLIC WEB INDEX  ·  :3300</text>
    <text x="930" y="614" text-anchor="middle" font-size="11" fill="#475569">Next.js 16 RSC, server-rendered</text>
    <text x="930" y="640" text-anchor="middle" font-size="11" fill="#4b5563">/ · /sellers · /services · /search</text>
    <text x="930" y="658" text-anchor="middle" font-size="11" fill="#4b5563">/recommend · /activity (live tape)</text>
    <text x="930" y="680" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">read-only, no auth</text>
  </g>

  <!-- ARROWS: sellers ↔ registry -->
  <line x1="220" y1="320" x2="500" y2="240" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="600" y1="320" x2="600" y2="240" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="980" y1="320" x2="700" y2="240" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="345" y="290" font-size="11" fill="#6b7280">register · record-tx</text>

  <!-- ARROWS: MCP ↔ sellers (HTTP + Lightning) -->
  <line x1="220" y1="560" x2="220" y2="460" stroke="#059669" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="280" y1="560" x2="540" y2="460" stroke="#059669" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="340" y1="560" x2="900" y2="460" stroke="#059669" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="100" y="510" font-size="11" fill="#059669">HTTP + ⚡ Lightning (NWC)</text>

  <!-- ARROWS: MCP ↔ registry (search/discovery) -->
  <line x1="320" y1="560" x2="500" y2="240" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arr-light)"/>
  <text x="370" y="430" font-size="11" fill="#9ca3af">search · recommend</text>

  <!-- ARROWS: dashboard ↔ MCP (control plane) -->
  <line x1="490" y1="630" x2="460" y2="630" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="490" y1="650" x2="460" y2="650" stroke="#475569" stroke-width="1.6" marker-start="url(#arr)"/>
  <text x="475" y="680" font-size="11" fill="#475569">control plane</text>

  <!-- ARROWS: web ↔ registry -->
  <line x1="930" y1="560" x2="700" y2="240" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arr-light)"/>
  <text x="900" y="430" font-size="11" fill="#9ca3af">read public endpoints</text>

  <!-- LEGEND -->
  <g transform="translate(80, 720)">
    <text x="0" y="0" font-size="11" fill="#6b7280" font-weight="600">LEGEND</text>
    <rect x="60" y="-10" width="14" height="14" fill="#eef2ff" stroke="#4f46e5"/><text x="80" y="0" font-size="11" fill="#4b5563">state of record</text>
    <rect x="200" y="-10" width="14" height="14" fill="#fffbeb" stroke="#d97706"/><text x="220" y="0" font-size="11" fill="#4b5563">sellers (paid endpoints)</text>
    <rect x="380" y="-10" width="14" height="14" fill="#ecfdf5" stroke="#059669"/><text x="400" y="0" font-size="11" fill="#4b5563">buyer-side (MCP)</text>
    <rect x="520" y="-10" width="14" height="14" fill="#f1f5f9" stroke="#475569"/><text x="540" y="0" font-size="11" fill="#4b5563">UI surfaces</text>
    <line x1="640" y1="-3" x2="680" y2="-3" stroke="#374151" stroke-width="1.6"/><text x="685" y="0" font-size="11" fill="#4b5563">signed call</text>
    <line x1="770" y1="-3" x2="810" y2="-3" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,3"/><text x="815" y="0" font-size="11" fill="#4b5563">public read</text>
  </g>
</svg>
