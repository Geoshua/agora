<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
    <marker id="arr5-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Money flow  ·  one paid call  ·  buyer → Lightning → seller (+ ledger)</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b7280">Sub-cent amounts · ~200 ms settle · cryptographic proof of payment · no chargebacks</text>

  <!-- HERO BOXES -->
  <!-- Buyer wallet -->
  <g>
    <rect x="60" y="160" width="220" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="170" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">BUYER WALLET</text>
    <text x="170" y="212" text-anchor="middle" font-size="12" fill="#047857">NWC · Alby Hub / Lexe / etc.</text>
    <text x="170" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">−240 sat</text>
    <text x="170" y="262" text-anchor="middle" font-size="11" fill="#9ca3af">~ $0.16 USD</text>
  </g>

  <!-- Lightning -->
  <g>
    <rect x="380" y="160" width="220" height="120" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="490" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">LIGHTNING NETWORK</text>
    <text x="490" y="212" text-anchor="middle" font-size="12" fill="#a16207">routed payment</text>
    <text x="490" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">≈ 1 sat fee</text>
    <text x="490" y="262" text-anchor="middle" font-size="11" fill="#9ca3af">settled in &lt; 1 s</text>
  </g>

  <!-- Seller wallet -->
  <g>
    <rect x="700" y="160" width="220" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="810" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">SELLER WALLET</text>
    <text x="810" y="212" text-anchor="middle" font-size="12" fill="#a16207">vision-oracle-3 NWC</text>
    <text x="810" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">+239 sat</text>
    <text x="810" y="262" text-anchor="middle" font-size="11" fill="#9ca3af">net of routing</text>
  </g>

  <!-- Platform (counter-only today) -->
  <g>
    <rect x="970" y="160" width="170" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1055" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PLATFORM</text>
    <text x="1055" y="204" text-anchor="middle" font-size="11" fill="#6d28d9">2% fee</text>
    <text x="1055" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">+5 sat</text>
    <text x="1055" y="260" text-anchor="middle" font-size="10" fill="#9ca3af" font-style="italic">counter only</text>
    <text x="1055" y="274" text-anchor="middle" font-size="10" fill="#9ca3af" font-style="italic">(NWC payout deferred)</text>
  </g>

  <!-- ARROWS -->
  <line x1="280" y1="220" x2="380" y2="220" stroke="#ca8a04" stroke-width="2.4" marker-end="url(#arr5)"/>
  <line x1="600" y1="220" x2="700" y2="220" stroke="#ca8a04" stroke-width="2.4" marker-end="url(#arr5)"/>
  <line x1="920" y1="220" x2="970" y2="220" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr5-grey)"/>

  <text x="330" y="208" text-anchor="middle" font-size="11" fill="#a16207">pay(invoice)</text>
  <text x="650" y="208" text-anchor="middle" font-size="11" fill="#a16207">settle</text>
  <text x="945" y="208" text-anchor="middle" font-size="10" fill="#9ca3af">deferred</text>

  <!-- LEDGER PANEL -->
  <g transform="translate(60, 330)">
    <rect width="1080" height="190" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="540" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">REGISTRY LEDGER (transactions table)  ·  fire-and-forget POST after every settle</text>

    <g transform="translate(20, 56)">
      <rect width="1040" height="120" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="20" y="24" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#1e1b4b" font-weight="700">POST /api/v1/transactions/record  ·  signed by seller</text>
      <text x="20" y="48" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#374151">{ buyer_pubkey:    "9f4a…b201"</text>
      <text x="20" y="64" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#374151">  seller_pubkey:   "e725…4af7"  (← cryptographically the signer)</text>
      <text x="20" y="80" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#374151">  service_id:      "vision-oracle-3.listing-verify"</text>
      <text x="20" y="96" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="11" fill="#374151">  amount_sats:     240,  platform_fee_sats: 5,  payment_hash: "…" }</text>
      <text x="20" y="112" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="10" fill="#9ca3af" font-style="italic">→ /activity feed updates within 2 s · /sellers/&lt;pubkey&gt;/stats reflects new totals</text>
    </g>
  </g>

  <!-- MOCK vs REAL -->
  <g transform="translate(60, 550)">
    <text x="540" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Same wire format · two execution modes</text>

    <g transform="translate(0, 24)">
      <rect width="510" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="700" fill="#14532d">MOCK MODE  ·  default</text>
      <text x="20" y="52" font-size="11" fill="#14532d">• Deterministic preimages generated in-process</text>
      <text x="20" y="70" font-size="11" fill="#14532d">• POST /api/dev/pay returns the preimage instantly</text>
      <text x="20" y="88" font-size="11" fill="#14532d">• Counter-based "wallets" — no NWC client constructed</text>
      <text x="20" y="106" font-size="11" fill="#14532d">• Same L402 flow, same macaroon shape, same headers</text>
      <text x="20" y="124" font-size="11" fill="#14532d">• Zero network egress to payment infrastructure</text>
      <text x="20" y="146" font-size="11" font-style="italic" fill="#15803d">Ideal for: CI, demos, offline development, SPIRAL judging</text>
      <text x="20" y="166" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">MOCK_MODE=true   (default everywhere)</text>
    </g>

    <g transform="translate(530, 24)">
      <rect width="510" height="180" rx="10" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="700" fill="#854d0e">REAL MODE  ·  Lightning mainnet</text>
      <text x="20" y="52" font-size="11" fill="#78350f">• Provider mints invoice via NWC (makeInvoice 240·1000 msat)</text>
      <text x="20" y="70" font-size="11" fill="#78350f">• Buyer pays via NWC (LNClient.pay, returns real preimage)</text>
      <text x="20" y="88" font-size="11" fill="#78350f">• Provider verifies sha256(preimage) === payment_hash</text>
      <text x="20" y="106" font-size="11" fill="#78350f">• Visible on Alby Hub / Lexe transaction logs both sides</text>
      <text x="20" y="124" font-size="11" fill="#78350f">• Settles in 200–800 ms · ~1 sat routing fee typical</text>
      <text x="20" y="146" font-size="11" font-style="italic" fill="#92400e">Bring-your-own-wallet · NWC string in .env, that's the whole setup</text>
      <text x="20" y="166" font-size="10" fill="#9ca3af" font-family="ui-monospace, monospace">MOCK_MODE=false  +  NWC_URL=nostr+walletconnect://…</text>
    </g>
  </g>

  <text x="600" y="752" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">Failure modes: invoice expires (TTL 5 min) · preimage doesn't match (provider rejects) · macaroon already consumed (single-use enforced)</text>
</svg>
