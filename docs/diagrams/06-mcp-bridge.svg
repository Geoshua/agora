<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">PayMyAgent — the human-to-agent bridge</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b7280">Give Claude a sat budget and a goal. The MCP server enforces three guardrails between the agent and your wallet.</text>

  <!-- HUMAN -->
  <g transform="translate(440, 110)">
    <rect width="320" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">HUMAN</text>
    <text x="160" y="60" text-anchor="middle" font-size="12" fill="#7c2d12">"verify these 5 hotels for me, $1 budget"</text>
  </g>
  <line x1="600" y1="190" x2="600" y2="220" stroke="#1f2937" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- CLAUDE -->
  <g transform="translate(440, 230)">
    <rect width="320" height="80" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="160" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">CLAUDE / CURSOR / any MCP host</text>
    <text x="160" y="60" text-anchor="middle" font-size="12" fill="#475569">decides which paid tools to call</text>
  </g>
  <line x1="600" y1="310" x2="600" y2="340" stroke="#1f2937" stroke-width="2" marker-end="url(#arr6)"/>
  <text x="610" y="328" font-size="11" fill="#6b7280">stdio (MCP)</text>

  <!-- MCP SERVER (THE BRIDGE) -->
  <g transform="translate(80, 350)">
    <rect width="1040" height="240" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="520" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">AGORA MCP SERVER (mcp/server.js)  ·  three guardrails before ANY paid call lands</text>

    <!-- 23 tools strip -->
    <g transform="translate(20, 60)">
      <rect width="320" height="160" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">23 agora_* tools (canonical)</text>
      <text x="160" y="42" text-anchor="middle" font-size="11" fill="#475569">+ 7 lumen_* aliases (deprecated)</text>
      <text x="160" y="60" text-anchor="middle" font-size="11" fill="#475569">+ 7 andromeda_* aliases (deprecated)</text>
      <line x1="20" y1="74" x2="300" y2="74" stroke="#a7f3d0"/>
      <text x="20" y="94" font-size="10" font-family="ui-monospace, monospace" fill="#374151">free   · status, discover, search,</text>
      <text x="60" y="108" font-size="10" font-family="ui-monospace, monospace" fill="#374151">  recommend, list_*, balance</text>
      <text x="20" y="126" font-size="10" font-family="ui-monospace, monospace" fill="#374151">paid   · verify_listing 240</text>
      <text x="60" y="140" font-size="10" font-family="ui-monospace, monospace" fill="#374151">       · file_receipt 120</text>
      <text x="60" y="154" font-size="10" font-family="ui-monospace, monospace" fill="#374151">       · subscribe / topup / cancel</text>
    </g>

    <!-- Guardrails -->
    <g transform="translate(360, 60)">
      <rect width="660" height="160" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="20" y="26" font-size="13" font-weight="700" fill="#065f46">GUARDRAILS — every paid tool checks all three before touching the wallet</text>

      <g transform="translate(20, 48)">
        <circle cx="14" cy="14" r="14" fill="#059669"/>
        <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
        <text x="40" y="14" font-size="13" font-weight="600" fill="#064e3b">Per-call cap  ·  MAX_PRICE_SATS (default 4000)</text>
        <text x="40" y="32" font-size="11" fill="#475569">refuses any single invoice priced above the cap, before paying</text>
      </g>

      <g transform="translate(20, 88)">
        <circle cx="14" cy="14" r="14" fill="#059669"/>
        <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
        <text x="40" y="14" font-size="13" font-weight="600" fill="#064e3b">Per-session budget  ·  MAX_BUDGET_SATS (default 5000)</text>
        <text x="40" y="32" font-size="11" fill="#475569">tracks spend across calls; refuses when exceeded; persisted to .mcp-session.json</text>
      </g>

      <g transform="translate(20, 128)">
        <circle cx="14" cy="14" r="14" fill="#dc2626"/>
        <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
        <text x="40" y="14" font-size="13" font-weight="600" fill="#7f1d1d">Kill switch  ·  one bit, immediate halt</text>
        <text x="40" y="32" font-size="11" fill="#475569">flipped from dashboard SPA via control plane; every paid tool reads the flag</text>
      </g>
    </g>
  </g>

  <!-- CONTROL PLANE -->
  <g transform="translate(60, 620)">
    <rect width="320" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">DASHBOARD SPA (5173)</text>
    <text x="160" y="48" text-anchor="middle" font-size="11" fill="#475569">Vite + React + Tailwind</text>
    <text x="160" y="68" text-anchor="middle" font-size="11" fill="#475569">human override · Bearer token gated</text>
    <text x="160" y="86" text-anchor="middle" font-size="11" fill="#475569">CORS-scoped to localhost only</text>
  </g>

  <line x1="380" y1="650" x2="430" y2="540" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr6)"/>
  <text x="395" y="595" font-size="10" fill="#475569">control plane HTTP</text>

  <!-- SELLERS RIGHT -->
  <g transform="translate(820, 620)">
    <rect width="320" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="160" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">SELLERS  ·  3000 / 3100 / 3200</text>
    <text x="160" y="48" text-anchor="middle" font-size="11" fill="#78350f">paid endpoints behind L402</text>
    <text x="160" y="68" text-anchor="middle" font-size="11" fill="#78350f">return 402 → buyer pays → replay → 200</text>
    <text x="160" y="86" text-anchor="middle" font-size="11" fill="#78350f">tx recorded to registry (fire-and-forget)</text>
  </g>

  <line x1="820" y1="650" x2="780" y2="540" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr6)"/>
  <text x="780" y="595" font-size="10" fill="#374151">HTTP + ⚡</text>

  <!-- WALLET -->
  <g transform="translate(440, 620)">
    <rect width="320" height="100" rx="12" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="160" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">YOUR WALLET (Alby / Lexe / etc.)</text>
    <text x="160" y="48" text-anchor="middle" font-size="11" fill="#a16207">connected via NWC connection string</text>
    <text x="160" y="68" text-anchor="middle" font-size="11" fill="#a16207">you keep custody · top up via Alby Hub UI</text>
    <text x="160" y="86" text-anchor="middle" font-size="11" fill="#a16207">all spending bounded by guardrails 1–3 above</text>
  </g>
  <line x1="600" y1="620" x2="600" y2="590" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#arr6)"/>
</svg>
