<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Identity = Ed25519 keypair  ·  every call is signed</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6b7280">no email · no password · no OAuth · the public key IS the agent ID</text>

  <!-- LEFT: SENDER -->
  <g>
    <rect x="80" y="120" width="420" height="220" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="290" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">SENDER (e.g. seller registering)</text>

    <text x="100" y="184" font-size="12" font-weight="700" fill="#374151">1. canonical string</text>
    <rect x="100" y="194" width="380" height="60" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="110" y="214" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#0f172a">POST</text>
    <text x="110" y="230" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#0f172a">/api/v1/sellers/register</text>
    <text x="110" y="246" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#0f172a">sha256(body)  ·  unix-ms timestamp</text>

    <text x="100" y="282" font-size="12" font-weight="700" fill="#374151">2. sign with private key</text>
    <text x="100" y="304" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#047857">sig = ed25519.sign(string, sk)</text>

    <text x="100" y="330" font-size="11" fill="#9ca3af" font-style="italic">private key never leaves the agent</text>
  </g>

  <!-- ARROW MIDDLE: HTTP -->
  <g>
    <line x1="510" y1="230" x2="690" y2="230" stroke="#1f2937" stroke-width="2" marker-end="url(#arr3)"/>
    <text x="600" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">HTTP</text>
  </g>

  <!-- RIGHT: HEADERS -->
  <g>
    <rect x="700" y="120" width="420" height="220" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="910" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">3 headers carry identity + proof</text>

    <rect x="720" y="170" width="380" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="730" y="190" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#1e293b" font-weight="700">X-Agora-Pubkey:</text>
    <text x="730" y="206" font-size="10" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#475569">e72536984944304a6e615021c95f7207…</text>

    <rect x="720" y="222" width="380" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="730" y="242" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#1e293b" font-weight="700">X-Agora-Timestamp:</text>
    <text x="730" y="258" font-size="10" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#475569">1745683425181</text>

    <rect x="720" y="274" width="380" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="730" y="294" font-size="11" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#1e293b" font-weight="700">X-Agora-Sig:</text>
    <text x="730" y="310" font-size="10" font-family="ui-monospace, 'Cascadia Code', monospace" fill="#475569">a1b2c3…  (64-byte Ed25519 signature)</text>
  </g>

  <!-- BOTTOM: VERIFIER -->
  <g>
    <rect x="80" y="400" width="1040" height="240" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="600" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">RECEIVER VERIFIES (Registry, Provider, Agent — anywhere a signed call lands)</text>

    <g transform="translate(110, 460)">
      <circle cx="14" cy="14" r="14" fill="#4f46e5"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
      <text x="40" y="14" font-size="13" font-weight="600" fill="#1e1b4b">Reconstruct canonical string</text>
      <text x="40" y="32" font-size="11" fill="#4b5563">from request (METHOD, PATH, sha256(body), timestamp from header)</text>
    </g>

    <g transform="translate(110, 510)">
      <circle cx="14" cy="14" r="14" fill="#4f46e5"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <text x="40" y="14" font-size="13" font-weight="600" fill="#1e1b4b">Verify signature  ·  ed25519.verify(sig, string, X-Agora-Pubkey)</text>
      <text x="40" y="32" font-size="11" fill="#4b5563">if false → 401. The pubkey IS the identity claim — no lookup, no DB.</text>
    </g>

    <g transform="translate(110, 560)">
      <circle cx="14" cy="14" r="14" fill="#4f46e5"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
      <text x="40" y="14" font-size="13" font-weight="600" fill="#1e1b4b">Check timestamp window  ·  | now − timestamp | &lt; 5 minutes</text>
      <text x="40" y="32" font-size="11" fill="#4b5563">prevents replay of captured signed calls outside the freshness window</text>
    </g>

    <g transform="translate(110, 610)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <text x="14" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">✓</text>
      <text x="40" y="14" font-size="13" font-weight="600" fill="#065f46">Accept request as authentically from this pubkey</text>
      <text x="40" y="32" font-size="11" fill="#4b5563">Registry stores pubkey as the seller's globally-unique ID — no accounts created</text>
    </g>
  </g>

  <text x="600" y="690" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">Outgoing emits X-Agora-* only · incoming accepts X-Andromeda-* and X-Lumen-* fallbacks for backwards-compat</text>
</svg>
